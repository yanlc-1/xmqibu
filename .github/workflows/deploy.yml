name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: "1.25.0"
  APP_ROOT: /opt/xmqibu-frontier-site
  RELEASE_BUNDLE: release-bundle.tar.gz

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run tests
        run: go test ./... -count=1

  deploy:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build release binary
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o frontier-site .

      - name: Prepare SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${{ secrets.DEPLOY_PORT }}" "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts
          cat <<'EOF' > ~/.ssh/config
          Host deploy-target
            HostName ${{ secrets.DEPLOY_HOST }}
            Port ${{ secrets.DEPLOY_PORT }}
            User ${{ secrets.DEPLOY_USER }}
            IdentityFile ~/.ssh/id_ed25519
            ServerAliveInterval 15
            ServerAliveCountMax 8
            TCPKeepAlive yes
            StrictHostKeyChecking yes
          EOF
          chmod 600 ~/.ssh/config

      - name: Ensure remote directories
        run: |
          ssh deploy-target \
            "mkdir -p '${APP_ROOT}/config' '${APP_ROOT}/uploads' '${APP_ROOT}/bin'"

      - name: Package release files
        run: |
          tar -czf "${RELEASE_BUNDLE}" frontier-site Dockerfile scripts/deploy_release.sh
          ls -lh "${RELEASE_BUNDLE}"

      - name: Upload release bundle
        run: |
          scp "${RELEASE_BUNDLE}" deploy-target:${APP_ROOT}/

      - name: Unpack release bundle
        run: |
          ssh deploy-target "
            tar -xzf '${APP_ROOT}/${RELEASE_BUNDLE}' -C '${APP_ROOT}' &&
            mv '${APP_ROOT}/scripts/deploy_release.sh' '${APP_ROOT}/bin/deploy_release.sh' &&
            rm -rf '${APP_ROOT}/scripts' '${APP_ROOT}/${RELEASE_BUNDLE}'
          "

      - name: Run remote deploy
        env:
          RELEASE_TAG: sha-${{ github.sha }}
        run: |
          ssh deploy-target \
            "chmod +x '${APP_ROOT}/bin/deploy_release.sh' && '${APP_ROOT}/bin/deploy_release.sh' '${RELEASE_TAG}'"
