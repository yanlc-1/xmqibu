name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: "1.25.0"
  APP_ROOT: /opt/xmqibu-frontier-site

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run tests
        run: go test ./... -count=1

  deploy:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build release binary
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o frontier-site .

      - name: Prepare SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${{ secrets.DEPLOY_PORT }}" "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Ensure remote directories
        run: |
          ssh -p "${{ secrets.DEPLOY_PORT }}" "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "mkdir -p '${APP_ROOT}/config' '${APP_ROOT}/uploads' '${APP_ROOT}/bin'"

      - name: Upload release files
        run: |
          scp -P "${{ secrets.DEPLOY_PORT }}" frontier-site \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${APP_ROOT}/frontier-site"
          scp -P "${{ secrets.DEPLOY_PORT }}" Dockerfile \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${APP_ROOT}/Dockerfile"
          scp -P "${{ secrets.DEPLOY_PORT }}" scripts/deploy_release.sh \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${APP_ROOT}/bin/deploy_release.sh"

      - name: Run remote deploy
        env:
          RELEASE_TAG: sha-${{ github.sha }}
        run: |
          ssh -p "${{ secrets.DEPLOY_PORT }}" "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "chmod +x '${APP_ROOT}/bin/deploy_release.sh' && '${APP_ROOT}/bin/deploy_release.sh' '${RELEASE_TAG}'"
